---
# Must precede install, else postinst masks iodined.service
- name: Updating config
  become: true
  ansible.builtin.template:
    src: etc/default/iodine.j2
    dest: /etc/default/iodine
    mode: '0600'
  notify: restart iodined

- name: Installing iodine
  become: true
  ansible.builtin.apt:
    name: iodine
  register: _iodined_apt

- name: Enable/disable iodined systemd unit
  become: true
  ansible.builtin.systemd_service:
    name: iodined
    enabled: "{{ iodined.enabled | bool }}"
    state: "{{ 'started' if iodined.enabled | bool else 'stopped' }}"
  when: not (ansible_check_mode and _iodined_apt is changed)
