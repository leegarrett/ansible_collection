---
argument_specs:
  main:
    short_description: Configure Microsoft Visual Studio Code APT repository
    description: |
      Configures the Visual Studio Code Microsoft APT repository.
      Prevents the vscode package from creating its own conflicting APT repository entry.
      Manages the GPG signing key for the repository.
      Manages the user settings and the user desktop entry.
    author: Lee Garrett
    options:
      vscode:
        type: dict
        required: true
        description: Configuration for the Visual Studio Code APT repository
        options:
          apt:
            type: dict
            description: APT repository configuration
            required: true
            options:
              enabled:
                default: true
                description: Enable or disable the Visual Studio Code repository
                type: bool
              types:
                choices:
                  - deb
                  - deb-src
                default: deb
                description: Package types to include from the repository
                elements: str
                type: list
              uris:
                default:
                  - "https://packages.microsoft.com/repos/code"
                description: URIs for the Visual Studio Code repository
                elements: str
                type: list
              suites:
                choices:
                  - stable
                default:
                  - stable
                description: Suite names for the repository (e.g., stable)
                elements: str
                type: list
              components:
                choices:
                  - main
                default:
                  - main
                description: Components within the repository to enable
                elements: str
                type: list
              signed_by:
                default: |
