          extensions:
            default: []
            description: >
              Visual Studio Code extension identifiers to install. Extensions
              installed but not listed here are removed.
            elements: str
            type: list
          settings:
            description: >
              Dictionary of Visual Studio Code user settings that will be
              written to the settings.json file.
            type: dict
          ssh_agent_forwarding:
            default: false
            description: >
              Whether to pass the SSH agent on to Visual Studio Code.
              When false, a user desktop entry overrides the system one and starts
              Visual Studio Code with SSH_AUTH_SOCK unset, so the forwarded agent
              does not reach dev containers. When true, the override is removed.
            type: bool
