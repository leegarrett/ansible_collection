---
cilium_cli:
  version: "0.20.0"
  install_dir: /usr/local/bin
  # bump version and checksum together, the checksum is per architecture
  checksum_sha256: >-
    94adc5c3be44d8240df91cec520536686f8a1eb29e5bc70c4c1c80137f00d764

# internal, not meant to be overridden
_cilium:
  arch_map:
    x86_64: amd64
    aarch64: arm64
  arch: "{{ _cilium.arch_map[ansible_facts.architecture] }}"
  tarball: "cilium-linux-{{ _cilium.arch }}.tar.gz"
  releases_url: "https://github.com/cilium/cilium-cli/releases/download"
  tarball_url: >-
    {{ _cilium.releases_url }}/v{{ cilium_cli.version }}/{{ _cilium.tarball }}
  install_needed: >-
    {{ 'v' ~ cilium_cli.version not in (_cilium_version.stdout | default('')) }}
