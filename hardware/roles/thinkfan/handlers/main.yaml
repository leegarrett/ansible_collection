---
- name: Reload thinkfan
  become: true
  ansible.builtin.systemd_service:
    name: thinkfan
    state: reloaded
  when: not (ansible_check_mode and _thinkfan_apt is changed)

- name: Restart thinkfan
  become: true
  ansible.builtin.systemd_service:
    name: thinkfan
    state: restarted
  when: not (ansible_check_mode and _thinkfan_apt is changed)
