---
- name: Install unattended-upgrades
  become: true
  ansible.builtin.apt:
    name: unattended-upgrades

- name: Configure unattended-upgrades
  become: true
  ansible.builtin.template:
    src: etc/apt/apt.conf.d/52unattended-upgrades-local.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"
    validate: apt-config -c %s dump
  when: unattended_upgrades.conf | length > 0

- name: Remove unattended-upgrades drop-in
  become: true
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    state: absent
  when: unattended_upgrades.conf | length == 0
